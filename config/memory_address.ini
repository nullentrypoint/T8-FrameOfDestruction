; Tekken 8 3.03.02: player/side/camera chains checked after a full game restart.
; Practice, room and match identity checks: dll/tests/address_checks_3_03_02.md.
; Multiple offsets are not fallbacks: the reader uses the first field offset.
[MemoryAddressOffsets]
player_data_pointer_offset = 0x959a320 0x10 0x68 0x8 0x88
p2_data_offset = 0xe220
rollback_frame_offset = 0x1c440
expected_module_address = 0x7ff725390000

[GameDataAddress]
frame_count = 0x1824
facing = 0x3ab4

[NonPlayerDataAddresses]
opponent_side = 0x9bdc7d8 0x4

; Spatial fields checked in 3.03.01 captures; visual alignment still needs checking.
; Player offsets are relative
; to the same rollback frame/player base as PlayerDataAddress (float XYZ).
; Contact is cached by the game: only consume it on a fresh hit/block.
[SpatialPlayerData]
contact_position = 0x3620
attack_hitbox_position = 0x29d0

; GWorld -> GameInstance -> LocalPlayers data -> LocalPlayer -> ViewStates
; -> FSceneViewState. UE5 double 4x4 matrices, projection without TAA jitter.
; Do not use PlayerCameraManager's cached FOV: it differs from rendered FOV.
[SpatialCamera]
view_state_pointer = 0x9bba200 0x1b8 0x38 0x0 0xd0 0x8
projection_matrix_offset = 0x7e0
view_matrix_offset = 0x8e0

; Throw research fields, read with their native widths (not generic DWORDs).
[ThrowPlayerData]
ground_buffer = 0x15e4
move_pointer = 0x3e0
animation = 0x3bc
accepted = 0x700
counter = 0x1c88
input = 0x3fec
tag = 0x6b0

[PlayerDataAddress]
move_id = 0x550
attack_type = 0x511
recovery = 0x5e4
actionable_frame = 0x5e8
published_frame_advantage = 0x23d4
hit_outcome = 0x634
