; Spatial fields verified on Tekken 8 3.02.02. Player offsets are relative
; to the same rollback frame/player base as PlayerDataAddress (float XYZ).
; Contact is cached by the game: only consume it on a fresh hit/block.
[SpatialPlayerData]
